name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build packages
    # The free arm64 macOS runners for public repositories are often at
    # capacity, and jobs there are dropped after waiting about 15 minutes.
    # The Intel image builds the same arm64 iOS binaries.
    runs-on: macos-15-intel
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen ldid dpkg

      - name: Use Xcode 26
        # Built with the iOS 26 SDK, the app takes the Liquid Glass look on
        # iOS 26 and keeps its usual look on earlier iOS.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -iv beta | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "Xcode 26 is not installed on this runner. Installed:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          xcodebuild -project Codling.xcodeproj -target Codling \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Work out the package version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(plutil -extract CFBundleShortVersionString raw build/Release-iphoneos/Codling.app/Info.plist)
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            if [ "$version" != "$base" ]; then
              echo "Tag $REF_NAME does not match the app version $base" >&2
              exit 1
            fi
          else
            # Development builds sort before the release they lead up to.
            version="$base~dev.$RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: scripts/package-deb.sh build/Release-iphoneos/Codling.app "${{ steps.version.outputs.version }}" dist

      # A test package for trying Codling's repairs on a device. It is kept
      # apart from the packages Codling ships, and is not attested.
      - name: Build the setup test package
        run: scripts/make-test-package.sh dist/test

      - name: Inspect the packages
        run: |
          for deb in dist/*.deb; do
            echo "== $deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          # The packaged binary must carry our entitlements.
          check=$(mktemp -d)
          dpkg-deb -x dist/*_iphoneos-arm64.deb "$check"
          ldid -e "$check/var/jb/Applications/Codling.app/Codling" | tee "$check/entitlements.plist"
          grep -q '<key>platform-application</key>' "$check/entitlements.plist"
          grep -q '<key>com.apple.private.persona-mgmt</key>' "$check/entitlements.plist"
          # The root helper is in the bundle, signed with its own entitlements.
          ldid -e "$check/var/jb/Applications/Codling.app/codling-helper" | tee "$check/helper.plist"
          grep -q '<key>platform-application</key>' "$check/helper.plist"
          lipo -info "$check/var/jb/Applications/Codling.app/codling-helper"
          plutil -extract CodlingPackageVersion raw "$check/var/jb/Applications/Codling.app/Info.plist"
          # Both packages carry the chip check as their preinst.
          for deb in dist/*.deb; do
            dpkg-deb --ctrl-tarfile "$deb" | tar -tf - | grep -Eq '^(\./)?preinst$'
          done
          cat dist/SHA256SUMS

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.deb

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: codling-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  # A build started by hand is also published as the development
  # prerelease, so that a phone can download the .deb straight from Safari:
  # no GitHub account and no zip. Each one replaces the last, at the same
  # addresses.
  publish-dev:
    name: Publish the development build
    if: github.event_name == 'workflow_dispatch'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codling-${{ needs.packages.outputs.version }}
          path: dist

      - name: Replace the development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          cd dist
          cp com.nexusjb.codling_*_iphoneos-arm64.deb codling-rootless.deb
          cp com.nexusjb.codling_*_iphoneos-arm64e.deb codling-roothide.deb
          notes="A development build of $REF_NAME ($SHA), for testing on a device. It is not a release.

          codling-rootless.deb is for rootless jailbreaks such as Dopamine, and codling-roothide.deb is for roothide."
          gh release delete dev --repo "$REPO" --yes --cleanup-tag || true
          gh release create dev --repo "$REPO" --prerelease --latest=false --target "$SHA" \
            --title "Development build $VERSION" --notes "$notes" \
            codling-rootless.deb codling-roothide.deb com.nexusjb.codling_*.deb SHA256SUMS
