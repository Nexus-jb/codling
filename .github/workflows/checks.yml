name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  text-policy:
    name: Text policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check files, commit messages and pull request text
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..HEAD"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -Eq '^0+$' \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # A new branch or the first push: check every commit on it.
            range="HEAD"
          fi
          python3 -I scripts/check-text-policy.py --commits "$range" \
            --text-env PR_TITLE --text-env PR_BODY --text-env REF_NAME

  packaging:
    name: Packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the chip check in the preinst
        run: sh scripts/test-preinst.sh

      - name: Test rebuilding installed packages for undo
        run: sh scripts/test-repack.sh

      - name: Test the helper's editing of codling.sources
        run: sh scripts/test-sources.sh

      - name: Test the helper's checks of purchased packages
        run: sh scripts/test-purchases.sh

  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show the Swift toolchain
        run: swift --version

      - name: Test CodlingCore
        run: swift test --package-path Core
