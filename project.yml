name: Codling

options:
  bundleIdPrefix: com.nexusjb
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Codling:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      # Plain Foundation code, also tested on its own (Core/Package.swift).
      - path: Core/Sources/CodlingCore
    settings:
      base:
        PRODUCT_NAME: Codling
        PRODUCT_BUNDLE_IDENTIFIER: com.nexusjb.codling
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: App/Codling-Bridging-Header.h
        # zlib, bzip2 and the Compression library read the package indexes.
        OTHER_LDFLAGS: "-lz -lbz2 -lcompression"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # The root helper is a plain C program; it goes inside the app bundle,
    # and the packaging script signs it with its own entitlements.
    postBuildScripts:
      - name: Build the root helper
        inputFiles:
          - $(SRCROOT)/Helper/codling-helper.c
          - $(SRCROOT)/Helper/repack.c
          - $(SRCROOT)/Helper/repack.h
          - $(SRCROOT)/Helper/sha256.c
          - $(SRCROOT)/Helper/sha256.h
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/codling-helper
        script: |
          set -e
          arch_flags=""
          for arch in $ARCHS; do arch_flags="$arch_flags -arch $arch"; done
          xcrun --sdk "$PLATFORM_NAME" clang $arch_flags -isysroot "$SDKROOT" \
            -m${PLATFORM_NAME}-version-min="$IPHONEOS_DEPLOYMENT_TARGET" \
            -Os -Wall -Wextra -Werror \
            "$SRCROOT/Helper/codling-helper.c" "$SRCROOT/Helper/repack.c" "$SRCROOT/Helper/sha256.c" \
            -o "$TARGET_BUILD_DIR/$WRAPPER_NAME/codling-helper"
